services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    networks:
      - backend
    restart: always

  vector_db:
    image: pgvector/pgvector:0.8.1-pg18-trixie
    container_name: vector-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${VECTOR_PGUSER}
      POSTGRES_PASSWORD: ${VECTOR_PGPASSWORD}
      POSTGRES_DB: ${VECTOR_PGDB}
    volumes:
      - vector_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VECTOR_PGUSER} -d ${VECTOR_PGDB}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  backend:
    driver: bridge

volumes:
  mongo-data:
  vector_data:
